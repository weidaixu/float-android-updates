name: Auto upstream Android release

on:
  schedule:
    - cron: "17 19 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and verify without publishing
        type: boolean
        default: true
      force:
        description: Build even when upstream has not changed
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: float-upstream-android-release
  cancel-in-progress: false

jobs:
  update-build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      UPSTREAM_REPOSITORY: xiaolongbao0709/ai-virtual-phone
      RELEASE_REPOSITORY: weidaixu/float-android-updates
      EXPECTED_CERT_SHA256: 14eaa56eca4dc41a4f09be90dcd9ad78e4ea608ac51ed58619222a94a02bd154
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect upstream update
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git fetch --no-tags upstream main
          upstream_sha="$(git rev-parse upstream/main)"
          recorded_sha="$(tr -d '\r\n ' < .upstream-commit)"
          changed=false
          if [[ "$upstream_sha" != "$recorded_sha" ]]; then changed=true; fi
          force="${{ github.event.inputs.force || 'false' }}"
          dry_run="${{ github.event.inputs.dry_run || 'false' }}"
          run_build=false
          if [[ "$changed" == true || "$force" == true || "$dry_run" == true ]]; then run_build=true; fi
          echo "upstream_sha=$upstream_sha" >> "$GITHUB_OUTPUT"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "dry_run=$dry_run" >> "$GITHUB_OUTPUT"
          echo "run_build=$run_build" >> "$GITHUB_OUTPUT"

      - name: Merge upstream safely
        if: steps.detect.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git merge --no-edit upstream/main
          find .github/workflows -maxdepth 1 -type f ! -name auto-upstream-android-release.yml -delete

      - uses: actions/setup-node@v5
        if: steps.detect.outputs.run_build == 'true'
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        if: steps.detect.outputs.run_build == 'true'
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3
        if: steps.detect.outputs.run_build == 'true'

      - name: Install Android SDK packages
        if: steps.detect.outputs.run_build == 'true'
        run: sdkmanager "platforms;android-35" "build-tools;34.0.0"

      - name: Test release metadata logic
        if: steps.detect.outputs.run_build == 'true'
        run: node --test android-wrapper/tests/release-version.test.mjs

      - name: Prepare next version
        if: steps.detect.outputs.run_build == 'true' && steps.detect.outputs.dry_run != 'true'
        id: version
        run: node android-wrapper/scripts/prepare-auto-release.mjs version

      - name: Use current version for dry run
        if: steps.detect.outputs.run_build == 'true' && steps.detect.outputs.dry_run == 'true'
        id: dry_version
        shell: bash
        run: |
          version_name="$(node -p "require('./latest.json').versionName")"
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "apk_name=Float-Android-v${version_name}.apk" >> "$GITHUB_OUTPUT"

      - name: Build static mobile web assets
        if: steps.detect.outputs.run_build == 'true'
        run: node android-wrapper/scripts/build-mobile.mjs

      - name: Install Capacitor wrapper dependencies
        if: steps.detect.outputs.run_build == 'true'
        working-directory: android-wrapper
        run: npm ci --ignore-scripts

      - name: Sync Capacitor Android project
        if: steps.detect.outputs.run_build == 'true'
        working-directory: android-wrapper
        run: npx cap sync android

      - name: Restore fixed Android signing identity
        if: steps.detect.outputs.run_build == 'true'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          mkdir -p "$HOME/.android"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"

      - name: Run Android tests and build APK
        if: steps.detect.outputs.run_build == 'true'
        working-directory: android-wrapper/android
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug --no-daemon

      - name: Verify package and signing certificate
        if: steps.detect.outputs.run_build == 'true'
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          apk="android-wrapper/android/app/build/outputs/apk/debug/app-debug.apk"
          cert="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          aapt="$ANDROID_HOME/build-tools/34.0.0/aapt"
          "$cert" verify "$apk"
          actual_cert="$("$cert" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n1)"
          test "$actual_cert" = "$EXPECTED_CERT_SHA256"
          "$aapt" dump badging "$apk" | grep -q "package: name='com.floatapp.mobile'"
          apk_name="${{ steps.version.outputs.apk_name || steps.dry_version.outputs.apk_name }}"
          mkdir -p dist
          cp "$apk" "dist/$apk_name"
          echo "apk_path=dist/$apk_name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        if: steps.detect.outputs.run_build == 'true'
        with:
          name: verified-float-android-${{ github.run_number }}
          path: ${{ steps.verify.outputs.apk_path }}
          retention-days: 7

      - name: Generate release manifest
        if: steps.detect.outputs.run_build == 'true' && steps.detect.outputs.dry_run != 'true'
        id: manifest
        run: >-
          node android-wrapper/scripts/prepare-auto-release.mjs manifest
          "${{ steps.verify.outputs.apk_path }}"
          "$RELEASE_REPOSITORY"
          "自动同步 Float 作者源码 ${{ steps.detect.outputs.upstream_sha }} 并通过 Android 构建与签名校验。"

      - name: Commit verified upstream update
        if: steps.detect.outputs.run_build == 'true' && steps.detect.outputs.dry_run != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s\n' "${{ steps.detect.outputs.upstream_sha }}" > .upstream-commit
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "release: Float Android ${{ steps.version.outputs.tag }}"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${RELEASE_REPOSITORY}.git"
          git push origin HEAD:main

      - name: Publish verified APK
        if: steps.detect.outputs.run_build == 'true' && steps.detect.outputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ steps.version.outputs.tag }}"
          "${{ steps.verify.outputs.apk_path }}#${{ steps.version.outputs.apk_name }}"
          --repo "$RELEASE_REPOSITORY"
          --target main
          --title "Float Android ${{ steps.version.outputs.tag }}"
          --notes "自动同步 Float 作者最新源码；构建、测试、包名与签名校验均已通过。"
